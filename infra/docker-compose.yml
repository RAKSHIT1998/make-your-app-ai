# Local production-like stack: Postgres + API + web.
#   cp .env.example .env   # fill in Supabase + keys
#   docker compose -f infra/docker-compose.yml up --build
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: mya }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 10 }
    ports: ["5432:5432"]

  migrate:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    env_file: ../.env
    environment: { DIRECT_URL: "postgresql://postgres:postgres@postgres:5432/mya" }
    working_dir: /migrate
    entrypoint: ["npx", "prisma", "migrate", "deploy"]
    depends_on: { postgres: { condition: service_healthy } }

  api:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    env_file: ../.env
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/mya"
      STORAGE_DIR: /data/projects
    volumes: [projects:/data/projects]
    ports: ["4000:4000"]
    depends_on: { migrate: { condition: service_completed_successfully } }

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata: {}
  projects: {}
